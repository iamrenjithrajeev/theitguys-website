<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#0F1E35"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="/demo/manifest.json" crossorigin="use-credentials"/>
<title>Storage Keys demo | The IT Guys</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#030508;overscroll-behavior:none}
body{font-family:system-ui,sans-serif;color:#e0e6f1;-webkit-tap-highlight-color:transparent}
.bar{height:40px;padding:0 14px;padding-top:env(safe-area-inset-top);box-sizing:content-box;display:flex;align-items:center;justify-content:space-between;background:#030508;border-bottom:1px solid rgba(255,255,255,.08);font-family:'JetBrains Mono',monospace;font-size:12px}
.bar a{color:#8a93a6;text-decoration:none;display:flex;align-items:center;gap:6px;min-height:40px}
.bar a:hover{color:#e0e6f1}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.02em}
.brand span{color:#00e676}
.switch{display:flex;gap:6px}
.switch a{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:0 12px;min-height:30px}
.switch a.on{border-color:#00e676;color:#00e676}
/* Full-screen app on phones */
.stage{position:relative;height:calc(100% - 41px - env(safe-area-inset-top))}
.stage.phone #app{width:100%;height:100%;overflow:hidden}
.stage.page{overflow-y:auto;background:#F4F6F8}
/* Device frame on bigger screens */
@media (min-width:600px){
  .stage.phone{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0c1a14 0,#030508 60%)}
  .stage.phone .device{width:410px;height:864px;border-radius:54px;background:#000;padding:10px;box-shadow:0 0 0 2px #222,0 40px 90px rgba(0,230,118,.10);transform-origin:center;flex:none}
  .stage.phone #app{width:390px;height:844px;border-radius:44px}
}
@media (max-width:599px){
  .stage.phone .device{width:100%;height:100%}
  .switch{display:none}
}
#app button{transition:transform .08s ease,filter .12s ease}
#app button:active{transform:scale(.97);filter:brightness(.95)}
.loading{padding:60px 20px;text-align:center;color:#556070;font-family:'JetBrains Mono',monospace;font-size:13px;background:#F3F5F8;height:100%}
.badge{position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:1001;pointer-events:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.06em;color:rgba(255,255,255,.9);background:rgba(3,5,8,.55);border-radius:999px;padding:3px 8px}
.badge span{color:#00e676}
.stage.phone ~ .badge{bottom:calc(84px + env(safe-area-inset-bottom))}
@media (min-width:600px){.stage.phone ~ .badge{bottom:16px}}
</style>
</head>
<body>
<div class="bar">
<a href="/demo/" aria-label="Back to the demo home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="brand">THE IT <span>GUYS</span></span></a>
<nav class="switch" aria-label="Switch app">
<a href="/demo/app.html?screen=customer" data-s="customer">Customer app</a>
<a href="/demo/app.html?screen=adminphone" data-s="adminphone">Admin phone</a>
<a href="/demo/app.html?screen=adminpanel" data-s="adminpanel">Admin panel</a>
</nav>
</div>
<div class="stage" id="stage"><div class="device"><div id="app"><div class="loading">Loading…</div></div></div></div>
<div class="badge">THE IT <span>GUYS</span> DEMO</div>

<script src="/demo/runtime.js"></script>
<script>
(function () {
  var screens = {
    customer: { file: '/demo/screens/customer.txt', kind: 'phone', title: 'Customer app' },
    adminphone: { file: '/demo/screens/adminphone.txt', kind: 'phone', title: 'Admin phone app' },
    adminpanel: { file: '/demo/screens/adminpanel.txt', kind: 'page', title: 'Admin panel' }
  };
  var key = (new URLSearchParams(location.search).get('screen') || 'customer');
  if (!screens[key]) key = 'customer';
  var s = screens[key];
  document.title = s.title + ' · Storage Keys demo | The IT Guys';
  document.querySelectorAll('.switch a').forEach(function (a) { if (a.getAttribute('data-s') === key) a.className = 'on'; });
  var stage = document.getElementById('stage');
  stage.className = 'stage ' + s.kind;
  var app = document.getElementById('app');
  var small = window.matchMedia('(max-width:599px)');

  function fit() {
    if (s.kind !== 'phone') return;
    var d = stage.querySelector('.device');
    if (small.matches) { d.style.transform = ''; return; }
    var sc = Math.min(1, (stage.clientHeight - 24) / 864, (stage.clientWidth - 24) / 410);
    d.style.transform = 'scale(' + sc + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  window.DemoRuntime.mountScreen(s.file, app, {}, { fill: s.kind === 'phone' && small.matches }).catch(function () {
    app.innerHTML = '<div class="loading">This screen did not load. Check your connection and refresh.</div>';
  });
})();
</script>
</body>
</html>
